[project]
name = "simple-rag"
version = "0.1.0"
description = "AgenticAgent with RAG capability using Google ADK and Neo4j"
readme = "README.md"
requires-python = "<3.15,>=3.11.0"
dependencies = [

    "neo4j-graphrag[openai] (>=1.24.0,<2.0.0)",
    "neo4j>=6.3.1,<7.0.0",
    "fastmcp==4.1.6",
    "mcp>=2.3.0,<3.0.0",
    "aiohttp==3.9.5",
    "httpx>=0.28.1,<1.0.0",
    "python-dotenv>=1.1.0",
    "pydantic>=2.12,<3",
    "pydantic-settings==2.5.2",
    "pytest==8.2.0",
    "pytest-asyncio==0.23.0",
    "ollama (>=0.6.3,<0.7.0)",
]

[project.optional-dependencies]
dev = [
    "black==24.4.0",
    "ruff==0.4.0",
    "mypy==1.10.0",
]

[project.scripts]
simple-rag = "simple_rag.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
