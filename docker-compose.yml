version: '3.8'

services:
  neo4j:
    image: neo4j:5.23.0
    container_name: simple-rag-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4JLABS_PLUGINS: '["browser"]'
    volumes:
      - ./data/neo4j/data:/var/lib/neo4j/data
      - ./data/neo4j/logs:/var/lib/neo4j/logs
      - ./data/neo4j/import:/import
    networks:
      - simple-rag-network
    healthcheck:
      test: ["CMD-SHELL", "neo4j status"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simple-rag-app
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - simple-rag-network
    restart: unless-stopped


networks:
  simple-rag-network:
    driver: bridge
